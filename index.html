<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Hello World</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090a0f;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    .background-blobs {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      filter: blur(80px);
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      animation: float-blobs 12s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #ff007f 0%, rgba(255, 0, 127, 0) 70%);
      top: 15%;
      left: 15%;
    }

    .blob-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #00d2ff 0%, rgba(0, 210, 255, 0) 70%);
      bottom: 15%;
      right: 15%;
      animation-delay: -6s;
    }

    .blob-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #7928ca 0%, rgba(121, 40, 202, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 16s;
    }

    @keyframes float-blobs {
      0% {
        transform: translate(0px, 0px) scale(1);
      }
      50% {
        transform: translate(50px, -40px) scale(1.1);
      }
      100% {
        transform: translate(-40px, 60px) scale(0.95);
      }
    }

    /* Card Container */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 3rem 4rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                  0 0 40px rgba(0, 210, 255, 0.1);
    }

    /* Animated Heading */
    .hello-world {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      gap: 0.1em;
      margin-bottom: 1rem;
    }

    .word {
      display: inline-flex;
    }

    .space {
      width: 0.4em;
    }

    .letter {
      display: inline-block;
      cursor: pointer;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 30%, #ff0844 70%, #ffb199 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: 
        wave-bounce 2s ease-in-out infinite,
        gradient-shift 6s ease infinite;
      animation-delay: calc(0.1s * var(--i));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
      filter: drop-shadow(0 0 15px rgba(79, 172, 254, 0.4));
    }

    .letter:hover {
      transform: translateY(-20px) scale(1.25) rotate(5deg) !important;
      filter: drop-shadow(0 0 25px rgba(255, 8, 68, 0.8));
    }

    /* Subtitle & Badge */
    .badge {
      display: inline-block;
      padding: 0.4rem 1.2rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulse-badge 3s ease-in-out infinite;
    }

    /* Keyframes */
    @keyframes wave-bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-16px);
      }
    }

    @keyframes gradient-shift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes pulse-badge {
      0%, 100% {
        opacity: 0.7;
        box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.2);
      }
      50% {
        opacity: 1;
        box-shadow: 0 0 15px 2px rgba(0, 242, 254, 0.3);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 2rem 1.5rem;
        margin: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient background glow elements -->
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Center Card -->
  <main class="container">
    <h1 class="hello-world" aria-label="Hello World">
      <span class="word">
        <span class="letter" style="--i: 1;">H</span>
        <span class="letter" style="--i: 2;">e</span>
        <span class="letter" style="--i: 3;">l</span>
        <span class="letter" style="--i: 4;">l</span>
        <span class="letter" style="--i: 5;">o</span>
      </span>
      <span class="space" aria-hidden="true"></span>
      <span class="word">
        <span class="letter" style="--i: 6;">W</span>
        <span class="letter" style="--i: 7;">o</span>
        <span class="letter" style="--i: 8;">r</span>
        <span class="letter" style="--i: 9;">l</span>
        <span class="letter" style="--i: 10;">d</span>
      </span>
    </h1>
    <div class="badge">Pure CSS Animation</div>
  </main>

</body>
</html>
